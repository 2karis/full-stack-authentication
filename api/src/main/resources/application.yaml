server:
  port: 7000

# Keycloak connection used by the password-change proxy (services run inside
# docker-compose, where "auth" is the Keycloak container hostname).
keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:fullstackauthentication}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:api-admin}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

spring:
  application:
    name: api
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/fullstackauthentication/protocol/openid-connect/certs}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fullstackauthentication}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect